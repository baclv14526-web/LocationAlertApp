name: 📍 Build & Release LocationAlert APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:          # Cho phép chạy thủ công từ tab Actions

permissions:
  contents: write             # Cần để tạo/ghi đè GitHub Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:

      # ── 1. CHECKOUT ───────────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── 2. JDK 17 ─────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. ANDROID SDK ────────────────────────────────────────────
      # ubuntu-latest có sẵn ANDROID_HOME nhưng thiếu platform-34.
      # Cài thêm platform + build-tools khớp compileSdk trong build.gradle.
      - name: Install Android SDK components
        run: |
          set -e
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          # Tải cmdline-tools nếu chưa có
          if [ ! -f "$SDKM" ]; then
            echo "Downloading cmdline-tools..."
            wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
                 -O /tmp/cmdline-tools.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" \
               "$ANDROID_HOME/cmdline-tools/latest"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          # Chấp nhận license không cần tương tác
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true

          # Cài đúng platform + build-tools mà build.gradle dùng
          "$SDKM" \
            "platforms;android-34" \
            "platforms;android-28" \
            "build-tools;34.0.0"  \
            "platform-tools"

          echo "Android SDK ✓"

      # ── 4. GRADLE WRAPPER ─────────────────────────────────────────
      # Tạo wrapper nếu repo chưa có (thường xảy ra với project mới).
      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found → generating wrapper 8.7..."
            gradle wrapper --gradle-version=8.7 --distribution-type=bin
          fi
          chmod +x gradlew
          echo "Gradle wrapper ✓"

      # ── 5. CACHE GRADLE ───────────────────────────────────────────
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 6. TẠO KEYSTORE TẠM (EPHEMERAL) ──────────────────────────
      # Sinh password ngẫu nhiên 24 ký tự → mask trong log → xóa sau build.
      # Không cần cấu hình bất kỳ GitHub Secret nào trước.
      - name: Generate ephemeral keystore
        run: |
          set -e
          KS_FILE="${GITHUB_WORKSPACE}/release.keystore.jks"
          KS_PW=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 24)
          K_ALIAS="locationalert"

          # Ẩn password khỏi log
          echo "::add-mask::${KS_PW}"

          keytool -genkeypair -v                           \
            -keystore  "${KS_FILE}"                        \
            -alias     "${K_ALIAS}"                        \
            -keyalg    RSA                                 \
            -keysize   2048                                \
            -validity  10000                               \
            -storepass "${KS_PW}"                          \
            -keypass   "${KS_PW}"                          \
            -dname     "CN=LocationAlert,OU=Dev,O=Personal,L=HaNoi,S=HaNoi,C=VN" \
            -noprompt

          # Xuất biến để các step sau dùng
          echo "KS_FILE=${KS_FILE}"  >> "$GITHUB_ENV"
          echo "KS_PW=${KS_PW}"      >> "$GITHUB_ENV"
          echo "K_ALIAS=${K_ALIAS}"  >> "$GITHUB_ENV"
          echo "Keystore generated ✓"

      # ── 7. BUILD & KÝ APK ─────────────────────────────────────────
      # -P truyền signing config vào build.gradle qua project.hasProperty()
      # --no-daemon: phù hợp với CI (tiết kiệm RAM, không treo process)
      - name: Build signed release APK
        env:
          BUILD_VERSION_CODE: ${{ github.run_number }}
          BUILD_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: |
          ./gradlew assembleRelease          \
            --no-daemon                      \
            --stacktrace                     \
            -PRELEASE_STORE_FILE="${{ env.KS_FILE }}"      \
            -PRELEASE_STORE_PASSWORD="${{ env.KS_PW }}"    \
            -PRELEASE_KEY_ALIAS="${{ env.K_ALIAS }}"       \
            -PRELEASE_KEY_PASSWORD="${{ env.KS_PW }}"      \
            -PRELEASE_VERSION_CODE="${{ github.run_number }}" \
            -PRELEASE_VERSION_NAME="1.0.${{ github.run_number }}"

      # ── 8. XÓA KEYSTORE NGAY SAU BUILD ───────────────────────────
      # if: always() đảm bảo chạy dù bước 7 lỗi
      - name: Delete keystore
        if: always()
        run: |
          rm -f "${{ env.KS_FILE }}"
          echo "Keystore deleted ✓"

      # ── 9. KIỂM TRA & ĐẶT TÊN APK ────────────────────────────────
      - name: Verify and rename APK
        run: |
          set -e
          APK_SRC="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_SRC" ]; then
            echo "❌ APK không tìm thấy tại $APK_SRC"
            echo "── Nội dung outputs ──"
            find app/build/outputs -type f 2>/dev/null || echo "(trống)"
            exit 1
          fi

          mkdir -p out
          VERSION="1.0.${{ github.run_number }}"
          APK_NAME="LocationAlert-v${VERSION}.apk"
          cp "$APK_SRC" "out/${APK_NAME}"

          SIZE=$(du -h "out/${APK_NAME}" | cut -f1)
          echo "✅ APK: ${APK_NAME} (${SIZE})"
          echo "APK_VERSION=${VERSION}"  >> "$GITHUB_ENV"
          echo "APK_NAME=${APK_NAME}"    >> "$GITHUB_ENV"

      # ── 10. UPLOAD ARTIFACT (backup 30 ngày) ──────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationAlert-build-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      # ── 11. GITHUB RELEASE (link tải luôn mới nhất) ───────────────
      # tag_name: latest bị ghi đè mỗi build → URL tải APK không đổi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "📍 LocationAlert v${{ env.APK_VERSION }}"
          prerelease: false
          make_latest: true
          body: |
            ## 📍 Location Alert – build #${{ github.run_number }}

            Ứng dụng định vị và cảnh báo khi đến nơi.
            Hỗ trợ GPS · WiFi · Mạng di động · Giọng nói tiếng Việt.

            ---

            ### 📲 Cài đặt trên Realme 2 (Android 9+)

            1. Nhấn vào file **`.apk`** bên dưới để tải về
            2. Mở file vừa tải từ thanh thông báo / Trình quản lý file
            3. Nếu bị chặn → **Cài đặt → Bảo mật → Nguồn không xác định → Bật cho trình duyệt**
            4. Nhấn **Cài đặt** và chờ hoàn tất
            5. Mở app → cấp quyền **Vị trí (Luôn luôn)**, **Micro**, **Lưu trữ**, **Thông báo**

            ---

            ### 🎯 Cách dùng

            | Bước | Thao tác |
            |------|----------|
            | 1 | Nhập địa điểm bằng **giọng nói 🎤** hoặc **gõ tay** rồi nhấn **Tìm** |
            | 2 | Hoặc nhấn **📌 Tọa độ** để nhập lat/lon thủ công |
            | 3 | Chọn **bán kính cảnh báo** (20–30m) bằng thanh kéo |
            | 4 | *(Tuỳ chọn)* Chọn **file MP3** làm âm báo |
            | 5 | Nhấn **▶ BẮT ĐẦU THEO DÕI** |
            | 6 | Khi cách đích ≤ bán kính → **rung + phát âm thanh + thông báo** |

            ### 🎤 Nhập giọng nói
            Nói tên địa điểm bằng tiếng Việt, ví dụ:
            > *"Hồ Hoàn Kiếm Hà Nội"*, *"Sân bay Nội Bài"*, *"Bệnh viện Bạch Mai"*

            ---

            > ⚠️ **Lưu ý chữ ký:** Mỗi lần build dùng chữ ký tạm mới.
            > Nếu đã cài bản cũ, hãy **gỡ cài đặt trước** rồi cài bản này.

            **Commit:** `${{ github.sha }}`  |  **Build:** #${{ github.run_number }}
          files: out/*.apk
