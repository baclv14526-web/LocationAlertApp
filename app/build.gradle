plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace     "com.locationalert"   // AGP 7.3+ yêu cầu bắt buộc
    compileSdk    34

    defaultConfig {
        applicationId "com.locationalert"
        minSdk        28                // Android 9 (Pie)
        targetSdk     34
        // CI ghi đè qua -PRELEASE_VERSION_CODE / -PRELEASE_VERSION_NAME
        versionCode  (project.hasProperty('RELEASE_VERSION_CODE')
                      ? project.RELEASE_VERSION_CODE.toInteger() : 1)
        versionName  (project.hasProperty('RELEASE_VERSION_NAME')
                      ? project.RELEASE_VERSION_NAME           : "1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // ── Signing: kích hoạt khi CI truyền -P, fallback debug khi build local ──
    signingConfigs {
        release {
            storeFile     file(project.findProperty('RELEASE_STORE_FILE')     ?: 'dummy.jks')
            storePassword      (project.findProperty('RELEASE_STORE_PASSWORD') ?: '')
            keyAlias           (project.findProperty('RELEASE_KEY_ALIAS')      ?: '')
            keyPassword        (project.findProperty('RELEASE_KEY_PASSWORD')   ?: '')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig project.hasProperty('RELEASE_STORE_FILE')
                          ? signingConfigs.release
                          : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'com.google.code.gson:gson:2.10.1'

    // OkHttp — xử lý TLS/SSL tốt hơn URLConnection trên Android 9
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Conscrypt — TLS provider của Google, thay thế TLS stack cũ/lỗi của
    // Android 9 (API 28). Đây là fix TRIỆT ĐỂ cho lỗi "SSL handshake failed"
    // khi kết nối tới server chỉ hỗ trợ cipher suite/protocol mới, vì vấn đề
    // nằm ở chính OS chứ không phải ở cấu hình OkHttp.
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
}
